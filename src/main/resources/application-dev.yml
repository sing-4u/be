spring:
  application:
    name: api

  config:
    activate:
        on-profile: dev
    import:
        - aws-parameterstore:/config/api/application_dev/

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER}
    password: ${DB_PASS}
    hikari:
      pool-name: HikariPool-Local
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 20000
  cloud:
    aws:
      credentials:
        access-key: ${aws.accessKey}
        secret-key: ${aws.secretKey}
      region:
        static: ap-northeast-2
      s3:
        bucket: sing4u

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
          lob:
            non_contextual_creation: true
        default_batch_fetch_size: 100
    show-sql: true
    open-in-view: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 539834899906-k6coqhv9e97j81ep76e92883nhptcu1v.apps.googleusercontent.com #${GOOGLE_CLIENT_ID}
            client-secret: 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 #${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
  #      provider:  구굴의 경우 OAuth2 Provider가 Spring Security 내장되어있음
  #        google:
  #          authorization-uri: https://accounts.google.com/o/oauth2/auth
  #          token-uri: https://oauth2.googleapis.com/token
  #          user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USER}
    password: ${MAIL_PASS}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connection timeout: 3000   # 서버 연결 시도 타임아웃
      mail.smtp.timeout: 5000              # 읽기(응답 대기) 타임아웃
      mail.smtp.write timeout: 5000        # 쓰기(전송) 타임아웃

endpoints:
  public-api-list:
    - /api/v1/health/**
    - /swagger/**
    - /swagger-ui/**
    - /swagger-resources/**
    - /swagger-ui.html
    - /swagger-ui.html/**
    - /webjars/**
    - /v3/api-docs
    - /api/v1/users/register
    - /api/v1/home
    - /api/v1/auth/login/oauth/token
    - /v3/api-docs/**
    - /api/v1/auth/login/**
    - /api/v1/swagger/auth
    - /api/v1/auth/refresh
    - /api/v1/users/{publicId}
    - /api/v1/music/search
    - /api/v1/songRequests
    - /api/v1/auth/password-reset/**
    - /api/v1/artists/{artistPublicId}/sessions
    - /api/v1/users/platform/**
    - /api/v1/users/platform/{userPublicId}/activity-platform
    - /api/v1/songRequests/artists/{artistPublicId}


