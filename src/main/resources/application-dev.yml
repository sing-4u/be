spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC
    username: ${DB_USER}
    password: ${DB_PASS}
    hikari:
      pool-name: HikariPool-Local
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
          lob:
            non_contextual_creation: true
        default_batch_fetch_size: 100
    show-sql: true
    open-in-view: false

endpoints:
  public-api-list:
    - /api/v1/health/**
    - /swagger/**
    - /swagger-ui/**
    - /swagger-resources/**
    - /swagger-ui.html
    - /swagger-ui.html/**
    - /webjars/**
    - /v3/api-docs
    - /api/v1/users/register
    - /api/v1/home


sing4u:
  server-url: https://api-dev.sing4u.com

springdoc:
  swagger-ui:
    enabled: true